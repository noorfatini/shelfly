spring.application.name=shelfly-backend

# --- MongoDB ---
# Simplest path for tonight: leave MONGODB_URI unset and just run a local MongoDB with no auth.
# If you use MongoDB Atlas instead, set MONGODB_URI to your full connection string (mongodb+srv://...)
# and everything below is ignored.
# Note: these default values are also overridable via real OS environment variables of the
# same name (Spring Boot gives env vars higher precedence than this file automatically) --
# no need to write them as self-referencing placeholders like ${MONGODB_HOST:localhost}, which
# causes a circular placeholder reference error.
MONGODB_HOST=localhost
MONGODB_PORT=27017
MONGODB_DATABASE=shelfly

# Spring Boot 4 renamed this property from spring.data.mongodb.uri to spring.mongodb.uri
# (the old name is accepted by config metadata but no longer actually binds the MongoClient).
spring.mongodb.uri=${MONGODB_URI:mongodb://${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_DATABASE}}

# --- JWT ---
JWT_SECRET=change-this-super-secret-key-shelfly-dev-only-please-override-in-prod-0001
JWT_EXPIRATION_MINUTES=60

# --- Server ---
SERVER_PORT=8082
server.port=${SERVER_PORT}

# --- Borrowing business rule ---
SHELFLY_MAX_ACTIVE_BORROWINGS=3
SHELFLY_LOAN_PERIOD_DAYS=14

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.com.shelfly=DEBUG
